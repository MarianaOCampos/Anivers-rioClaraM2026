<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Aniversário, Clara</title>
<style>
  :root{
    --kraft-1:#e9dfc9;
    --kraft-2:#ddd0b0;
    --ink:#3a2e22;
    --wine:#6e1423;
    --wine-dark:#4a0e18;
    --cream:#f6efe0;
    --gold:#c9a24b;
    --gap: clamp(8px, 2.5vw, 28px);
    --page-w: clamp(118px, 42vw, 430px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.25), transparent 45%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, transparent 2px, transparent 4px),
      linear-gradient(135deg, var(--kraft-1), var(--kraft-2));
    min-height:100%;
    font-family: 'Iowan Old Style','Palatino Linotype', Georgia, serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 12% 22%, rgba(120,90,40,0.06) 0, transparent 2px),
      radial-gradient(circle at 76% 63%, rgba(120,90,40,0.06) 0, transparent 2px),
      radial-gradient(circle at 40% 85%, rgba(120,90,40,0.05) 0, transparent 2px),
      radial-gradient(circle at 90% 12%, rgba(120,90,40,0.05) 0, transparent 2px);
    background-size: 300px 300px;
    pointer-events:none;
    z-index:0;
  }

  .stage{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 8vh 16px 6vh;
    padding-top: calc(8vh + env(safe-area-inset-top,0px));
    padding-bottom: calc(6vh + env(safe-area-inset-bottom,0px));
  }

  h1.title{
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    letter-spacing:0.02em;
    color: var(--wine);
    margin: 0 0 4vh;
    text-align:center;
    font-weight:600;
    opacity:0.85;
  }

  .backbtn{
    opacity:0;
    pointer-events:none;
    align-self:center;
    margin-bottom: 3vh;
    background: var(--wine);
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius: 999px;
    font-family:inherit;
    font-size:0.85rem;
    letter-spacing:0.03em;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition: opacity .3s ease .3s;
  }
  .scene.opened ~ .backbtn,
  .backbtn.show{ opacity:1; pointer-events:auto; }

  /* ---------------- BOOK SCENE ---------------- */
  .scene{
    position:relative;
    display:flex;
    gap: var(--gap);
    justify-content:center;
    align-items:flex-start;
    perspective: 1800px;
    width:100%;
}

  .leaf-wrap, .right-page{
    width: var(--page-w);
    aspect-ratio: 700 / 990;
    position:relative;
  }

.leaf-wrap{
    transform: translateX(calc(50% + (var(--gap) / 2)));
    transition: transform .9s cubic-bezier(.3,.7,.2,1);
    z-index:3;
}

.scene.opened .leaf-wrap{
    transform: translateX(0);
    z-index:3;
}

.leaf{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transform-origin:center;
    transform:rotateY(0deg);
    transition:transform 1.05s cubic-bezier(.4,.15,.2,1);
    cursor:pointer;
}

.scene.opened .leaf{
    transform:rotateY(180deg);
}

  .face{
    position:absolute; inset:0;
    border-radius:4px;
    overflow:hidden;
    backface-visibility:hidden;
    background:#fff;
  }
  .face.front{
    box-shadow: 0 22px 46px rgba(50,25,10,0.35), 0 4px 10px rgba(50,25,10,0.22);
  }
  .face.front img{ width:100%; height:100%; object-fit:cover; display:block; }
  .face.back{
    transform: rotateY(180deg);
    box-shadow: 0 20px 45px rgba(50,25,10,0.30);
  }

  .cover-hint{
    text-align:center;
    margin-top:14px;
    font-size:0.85rem;
    color: var(--ink);
    opacity:0.55;
    font-style:italic;
    transition: opacity .3s ease;
  }
  .scene.opened + .cover-hint{ opacity:0; height:0; margin:0; pointer-events:none; }

 .right-page{
    opacity:0;
    pointer-events:none;
    transition: opacity .5s ease .45s;
    border-radius:4px;
    overflow:hidden;
    box-shadow: 0 20px 45px rgba(50,25,10,0.30);
    background:#fff;
    z-index:1;
}
  .scene.opened .right-page{
    opacity:1;
    pointer-events:auto;
  }

  /* ---- letter face (inside of leaf, left page) ---- */
  .envelope-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .letter-btn{
    position:absolute;
    left:6%; right:6%;
    top: 10%;
    height: 82%;
    cursor:pointer;
    border:none; padding:0; background:none;
    -webkit-tap-highlight-color: transparent;
  }
  .letter-img{
    position:absolute;
    left:0; right:0; margin:auto;
    top: 66%;
    width: 90%;
    border-radius:3px;
    box-shadow: 0 10px 26px rgba(30,10,10,0.35);
    opacity: 0;
    transition: top .6s cubic-bezier(.2,.8,.25,1), width .6s cubic-bezier(.2,.8,.25,1),
                transform .6s cubic-bezier(.2,.8,.25,1), opacity .45s ease;
    transform: rotate(-1.2deg);
  }
  .letter-btn.lifted .letter-img{
    top: 4%;
    width: 88%;
    opacity: 1;
    transform: rotate(0.4deg);
  }
  .page-hint{
    position:absolute;
    bottom: 8px; left:0; right:0;
    text-align:center;
    font-size:0.72rem;
    color:#fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    opacity:0.85;
    pointer-events:none;
    letter-spacing:0.02em;
  }

  /* ---- candles page ---- */
  .cake-wrap{ position:absolute; inset:0; }
  .cake-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .flame{
    position:absolute;
    transform-origin: 50% 100%;
    will-change: transform;
    filter: drop-shadow(0 2px 5px rgba(120,60,0,0.35));
  }
  .flame img{ width:100%; display:block; }
  .flame.out{ opacity:0; transition: opacity .35s ease; }

  .mic-row{
    position:absolute;
    left:8%; right:8%;
    bottom: 6%;
    display:flex;
    align-items:center;
    gap:8px;
    background: rgba(255,255,255,0.72);
    border-radius:999px;
    padding:7px 12px;
    backdrop-filter: blur(2px);
  }
  .meter{
    flex:1;
    height:8px;
    border-radius:999px;
    background: rgba(0,0,0,0.12);
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, #e8b23d, var(--wine));
    transition: width .06s linear;
  }
  .hold-btn{
    position:absolute;
    left:50%; transform:translateX(-50%);
    bottom: 13%;
    background: var(--wine);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:999px;
    font-family:inherit;
    font-size:0.78rem;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  .hold-btn:active, .hold-btn.holding{ background: var(--wine-dark); transform:translateX(-50%) scale(0.97); }

  .mic-note{
    position:absolute;
    top: 3%; left:6%; right:6%;
    text-align:center;
    font-size:0.68rem;
    color: var(--wine);
    opacity:0.85;
    background: rgba(255,255,255,0.6);
    border-radius:8px;
    padding:4px 6px;
    display:none;
  }
  .mic-note.show{ display:block; }

  .celebrate{
    position:absolute; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:16px;
    text-align:center;
    pointer-events:none;
  }
  .celebrate.show{ display:flex; }
  .celebrate h2{
    pointer-events:auto;
    margin:0;
    font-weight:600;
    font-size: clamp(1.3rem, 4vw, 2rem);
    color: var(--wine);
    text-shadow: 0 2px 8px rgba(255,255,255,0.9), 0 0px 20px rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.55);
    padding: 10px 22px;
    border-radius: 14px;
    font-family: inherit;
  }
  .relight-btn{
    pointer-events:auto;
    background: var(--wine);
    color:#fff;
    border:none;
    padding:9px 18px;
    border-radius:999px;
    font-family:inherit;
    font-size:0.82rem;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }

  .confetti-piece{
    position:absolute;
    top:-10px;
    width:8px; height:14px;
    opacity:0.95;
    animation-name: confettiFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    pointer-events:none;
  }
  @keyframes confettiFall{
    to{ transform: translateY(115%) rotate(540deg); opacity:0.2; }
  }

  @media (max-width: 640px){
    .leaf-wrap, .right-page{ width: min(42vw, 380px); }
  }

  @media (prefers-reduced-motion: reduce){
    .leaf, .leaf-wrap{ transition:none; }
  }
</style>
</head>

        <div class="mic-note" id="micNote">o microfone só funciona neste link publicado — use o botão abaixo se ele não pegar</div>

        <div class="mic-row" id="micRow">
          <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
        </div>
        <button class="hold-btn" id="holdBtn">segure para assoprar</button>

        <div class="celebrate" id="celebrate">
          <h2>Parabéns, Clara!</h2>
          <button class="relight-btn" id="relightBtn">acender de novo</button>
        </div>
      </div>
    </div>
  </div>

  <div class="cover-hint">toque para abrir</div>
  <button class="backbtn" id="backBtn">voltar para a capa</button>
</div>

<script>
(function(){
  var scene = document.getElementById('scene');
  var leaf = document.getElementById('leaf');
  var backBtn = document.getElementById('backBtn');
  var letterBtn = document.getElementById('letterBtn');
  var audioStarted = false;

  leaf.addEventListener('click', function(){
    if (scene.classList.contains('opened')) return;
    scene.classList.add('opened');
    backBtn.classList.add('show');
    if (!audioStarted){ audioStarted = true; initAudioOnce(); }
  });

  backBtn.addEventListener('click', function(){
    scene.classList.remove('opened');
    backBtn.classList.remove('show');
    letterBtn.classList.remove('lifted');
  });

  var pageHint = document.querySelector('.page-hint');
  letterBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var lifted = letterBtn.classList.toggle('lifted');
    if (pageHint) pageHint.textContent = lifted ? 'toque para guardar a carta' : 'toque na carta para ler';
  });

  // ---------------- CANDLES / BLOW LOGIC ----------------
  var flames = [0,1,2,3].map(function(i){ return document.getElementById('flame'+i); });
  var meterFill = document.getElementById('meterFill');
  var micNote = document.getElementById('micNote');
  var holdBtn = document.getElementById('holdBtn');
  var celebrate = document.getElementById('celebrate');
  var relightBtn = document.getElementById('relightBtn');
  var cakeWrap = document.getElementById('cakeWrap');

  var BLOW_THRESHOLD = 0.14;
  var BLOW_HOLD_MS = 500;
  var blowingSince = null;
  var extinguished = false;
  var currentLevel = 0;
  var rafId = null;
  var holdActive = false;
  var LEAN_DIR = 1; // all flames fall to the same side

  function initAudioOnce(){
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      micNote.classList.add('show');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream){
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        var ctx = new AudioCtx();
        var source = ctx.createMediaStreamSource(stream);
        var analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        source.connect(analyser);
        var data = new Uint8Array(analyser.fftSize);

        function tick(){
          analyser.getByteTimeDomainData(data);
          var sum = 0;
          for (var i=0;i<data.length;i++){
            var v = (data[i]-128)/128;
            sum += v*v;
          }
          var rms = Math.sqrt(sum/data.length);
          if (!holdActive) currentLevel = Math.min(1, rms*3.2);
          requestAnimationFrame(tick);
        }
        tick();
      })
      .catch(function(){
        micNote.classList.add('show');
      });
  }

  function startRAF(){
    if (rafId) return;
    function loop(){
      updateFlames(currentLevel);
      rafId = requestAnimationFrame(loop);
    }
    loop();
  }

  function updateFlames(level){
    meterFill.style.width = Math.round(level*100) + '%';

    if (!extinguished){
      flames.forEach(function(f, idx){
        if (level > 0.03){
          var angle = LEAN_DIR * Math.min(48, level*55) + (Math.sin(Date.now()/70 + idx)*3);
          var lean = LEAN_DIR * level * 10;
          f.style.transform = 'translateX(' + lean + 'px) rotate(' + angle + 'deg)';
        } else {
          f.style.transform = 'translateX(0) rotate(0deg)';
        }
      });

      if (level > BLOW_THRESHOLD){
        if (blowingSince === null) blowingSince = Date.now();
        if (Date.now() - blowingSince > BLOW_HOLD_MS){
          extinguishAll();
        }
      } else {
        blowingSince = null;
      }
    }
  }

  function extinguishAll(){
    extinguished = true;
    flames.forEach(function(f){ f.classList.add('out'); });
    setTimeout(function(){
      celebrate.classList.add('show');
      launchConfetti();
    }, 250);
  }

  function relight(){
    extinguished = false;
    blowingSince = null;
    currentLevel = 0;
    flames.forEach(function(f){
      f.classList.remove('out');
      f.style.transform = 'translateX(0) rotate(0deg)';
    });
    celebrate.classList.remove('show');
    var old = cakeWrap.querySelectorAll('.confetti-piece');
    old.forEach(function(p){ p.remove(); });
  }
  relightBtn.addEventListener('click', relight);

  function launchConfetti(){
    var colors = ['#c9435a','#e8b23d','#7fae6b','#d9739f','#c9a24b'];
    for (var i=0;i<36;i++){
      var p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = (Math.random()*100) + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
      p.style.animationDelay = (Math.random()*0.4) + 's';
      p.style.borderRadius = (Math.random() > 0.5) ? '50%' : '2px';
      cakeWrap.appendChild(p);
      (function(el){
        setTimeout(function(){ el.remove(); }, 3600);
      })(p);
    }
  }

  // ---- hold-to-blow fallback (button + spacebar) ----
  function holdStart(e){
    if (e) e.preventDefault();
    if (extinguished) return;
    holdActive = true;
    holdBtn.classList.add('holding');
    var rampStart = Date.now();
    (function ramp(){
      if (!holdActive) return;
      var t = (Date.now() - rampStart) / 300;
      currentLevel = Math.min(1, 0.35 + t*0.5);
      requestAnimationFrame(ramp);
    })();
  }
  function holdEnd(){
    holdActive = false;
    holdBtn.classList.remove('holding');
    currentLevel = 0;
  }
  holdBtn.addEventListener('mousedown', holdStart);
  holdBtn.addEventListener('touchstart', holdStart, {passive:false});
  holdBtn.addEventListener('mouseup', holdEnd);
  holdBtn.addEventListener('mouseleave', holdEnd);
  holdBtn.addEventListener('touchend', holdEnd);

  window.addEventListener('keydown', function(e){
    if (e.code === 'Space'){ e.preventDefault(); if(!holdActive) holdStart(); }
  });
  window.addEventListener('keyup', function(e){
    if (e.code === 'Space'){ e.preventDefault(); holdEnd(); }
  });

  startRAF();
})();
</script>
